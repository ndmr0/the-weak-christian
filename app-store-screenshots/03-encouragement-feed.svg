<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="2688" viewBox="0 0 1242 2688">
  <rect width="1242" height="2688" fill="#ffffff"/>
  <text x="94" y="210" fill="#050505" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="47" font-weight="900"><tspan x="94">The</tspan><tspan x="94" dy="45">Weak</tspan><tspan x="94" dy="45">Christian</tspan></text>
  <text x="94" y="560" fill="#050505" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="400" >
  <tspan x="94" dy="0">Christian, Christ is not</tspan>
  <tspan x="94" dy="67">merely part of your hope; He</tspan>
  <tspan x="94" dy="67">is the center of it. The Lord</tspan>
  <tspan x="94" dy="67">who called you is also able to</tspan>
  <tspan x="94" dy="67">keep you near. Everything your</tspan>
  <tspan x="94" dy="67">soul needs is gathered up in</tspan>
  <tspan x="94" dy="67">Him: mercy for sin, strength</tspan>
  <tspan x="94" dy="67">for weakness, and hope for</tspan>
  <tspan x="94" dy="67">tomorrow. The Lord Jesus</tspan>
  <tspan x="94" dy="67">remains faithful, and that is</tspan>
  <tspan x="94" dy="67">strong ground for your heart.</tspan>
</text>
<rect x="94" y="1387" width="132" height="7" fill="#050505"/>
<text x="94" y="1467" fill="#050505" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" font-style="italic">
  <tspan x="94" dy="0">&quot;For God so loved the world, that he gave his only</tspan>
  <tspan x="94" dy="48">begotten Son, that whosoever believeth in him should</tspan>
  <tspan x="94" dy="48">not perish, but have everlasting life.&quot; John 3:16,</tspan>
  <tspan x="94" dy="48">KJV</tspan>
</text>
